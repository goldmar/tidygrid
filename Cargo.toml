[package]
name = "tidygrid"
version = "0.1.1"
description = "A deterministic CLI for backing up and rearranging an iPhone Home Screen"
edition = "2021"
license = "MIT"
repository = "https://github.com/goldmar/tidygrid"
keywords = ["iphone", "ios", "homescreen", "cli"]
categories = ["command-line-utilities"]

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
# idevice is pre-1.0 and has shipped breaking point releases, so keep this exact.
idevice = { version = "=0.1.65", features = ["usbmuxd", "springboardservices"] }
plist = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
